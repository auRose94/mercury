[package]
name = "mercury"
version = "0.1.0"
edition = "2021"
description = "Mercury — a Rust reimagining of gold: JS-like dynamic values (var) with copy-on-write ergonomics, plus the sugar that makes prototyping feel like JavaScript."
license = "MIT"

[workspace]
members = ["derive"]

# Dependencies:
# - indexmap: gold's object preserves insertion order; indexmap is the wheel
#   for that — no hand-rolled ordered map.
# - serde: the non-negotiable. One Serialize/Deserialize impl on Var replaces
#   gold's hand-rolled JSON/BSON/CBOR/MsgPack/UBJSON — any serde format works
#   for free.
# - axum + tokio (optional, behind the `web` feature): the expressjs-like web
#   layer, where routes are `Var -> Var` closures. Needs the core to be
#   Send + Sync — which Arc/Mutex payloads deliver for the game module's
#   future job system too.
# No engine deps yet; Bevy coexistence is a later concern (see docs/roadmap.md).

[dependencies]
indexmap = "2"
serde = { version = "1", features = ["derive"] }
# FromVar: the typed hot-path seam (re-exported as mercury::FromVar)
mercury-derive = { path = "derive", version = "0.1.0" }
# store documents are JSON files; http responses are JSON
serde_json = "1"
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"], optional = true }
# http internals: chunked/ws streams, HTTPS transport (gold's lws sslCert/sslKey)
futures-util = { version = "0.3", optional = true }
# game module: rapier = the world sim (gold's world/physicsBackend, via the
# `physics` feature); wgpu = the render backend (`wgpu` feature). Both
# optional so the core stays lean — gold gates Bullet the same way.
rapier3d = { version = "0.36", optional = true }
wgpu = { version = "30", optional = true }
# blocking on wgpu adapter/device futures for offscreen setup
pollster = { version = "0.4", optional = true }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
tokio-rustls = { version = "0.26", optional = true }

[features]
default = []
# web: the http layer (Server/Response/ws/https). Optional so the core +
# parsers + store stay lean for embedding (Bevy etc.).
web = ["dep:axum", "dep:tokio", "dep:futures-util", "dep:axum-server", "dep:rustls", "dep:tokio-rustls"]
# physics: the rapier world sim (a "none" backend ships without it)
physics = ["dep:rapier3d"]
# render: the wgpu offscreen renderer
wgpu = ["dep:wgpu", "dep:pollster"]

[dev-dependencies]
serde_json = "1"
# web-layer tests drive the Router without binding a port (tower oneshot),
# and speak real HTTP/WebSockets against a live server
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.24"
futures-util = "0.3"
# self-signed certs for the HTTPS tests
rcgen = "0.13"
# PNG screenshots for the wgpu render example
image = "0.25"

[[example]]
name = "web_demo"
required-features = ["web"]

[[example]]
name = "web_site"
required-features = ["web"]

[[example]]
name = "game_world"
required-features = ["physics", "wgpu"]
