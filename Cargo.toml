[package]
name = "mercury"
version = "0.1.0"
edition = "2021"
description = "Mercury — a Rust reimagining of gold: JS-like dynamic values (var) with copy-on-write ergonomics, plus the sugar that makes prototyping feel like JavaScript."
license = "MIT"

# Dependency-light on purpose. indexmap is the one real dependency, and it's
# the right call: gold's object preserves insertion order, and indexmap is the
# wheel for that — no point hand-rolling an ordered map. serde is the obvious
# next add (it would replace gold's hand-rolled JSON/BSON/CBOR/MsgPack/UBJSON
# with a single trait). No engine deps yet; Bevy coexistence is a later concern.

[dependencies]
indexmap = "2"
